          {label:'删评论，等热度过去',hint:'省事，但口碑可能继续跌',effect:{energy:-3,rep:-13},quality:-4,heat:7,viral:.01,line:'评论少了，疑问却没有消失。'},
          {label:'做一期观点对比解析',hint:'化争议为内容，结果有波动',effect:{energy:-14,rep:4,skill:4},quality:9,heat:13,viral:.04,line:'你逐条解释自己的论证，一些质疑者变成了订阅者。'}]},
        {title:'一个朋友邀请你进剪辑工作室',text:'固定工资、稳定项目，但个人账号可能没法保持每周更新。',options:[
          {label:'加入工作室，边做边学',hint:'收入和能力提高，更新慢一点',effect:{money:850,skill:6,energy:-11},quality:4,heat:-8,viral:0,line:'你学到了团队流程，也开始重新安排个人账号。'},
          {label:'兼职合作，保留自己的节奏',hint:'平衡收入、成长与精力',effect:{money:380,skill:3,energy:-13,rep:2},quality:7,heat:3,viral:.01,line:'白天帮朋友做项目，晚上依然保留一段属于自己的时间。'},
          {label:'拒绝，专心做个人频道',hint:'保住自由，现金压力增加',effect:{money:-180,energy:2,rep:2},quality:9,heat:5,viral:.02,line:'你把邀约存进收藏夹，继续经营自己的小频道。'}]},
        {title:'一条旧视频突然被翻红',text:'几个月前没人看的作品，今天忽然被很多人转发。新观众正等着点开你的主页。',options:[
          {label:'把旧系列补全',hint:'能留住新观众，耗精力',effect:{energy:-17,skill:3},quality:10,heat:18,viral:.06,line:'你补上了曾经搁置的第二集，旧坑终于有人一起追。'},
          {label:'优化主页和置顶简介',hint:'涨粉转化更稳',effect:{energy:-7,rep:4},quality:5,heat:9,viral:.02,line:'你把作品重新整理，新来的观众很快找到自己喜欢的一期。'},
          {label:'趁热开启直播聊天',hint:'亲近观众，也有翻车风险',effect:{energy:-12,rep:1},quality:5,heat:16,viral:.04,line:'第一次直播有些手忙脚乱，却有人说终于见到了屏幕后的人。'}]},
        {title:'家人问你：这个真能做下去吗',text:'饭桌上没有人嘲笑你，但那句关心让你开始怀疑自己。电脑里还有一条没剪完的视频。',options:[
          {label:'展示数据，也坦白困难',hint:'恢复状态，口碑不变',effect:{energy:13,money:100},quality:2,heat:0,viral:0,line:'你第一次认真算了账，也第一次说清自己为什么喜欢创作。'},
          {label:'拿出成片证明自己',hint:'能力提升，精力减少',effect:{energy:-16,skill:5,rep:2},quality:11,heat:7,viral:.02,line:'你没有争辩，几天后把新作品给他们看。'},
          {label:'先找份兼职，减轻压力',hint:'有现金缓冲，更新变慢',effect:{money:620,energy:-8},quality:-7,heat:-8,viral:-.01,line:'收入让你踏实了一些，只是时间线推进得更慢。'}]},
        {title:'有人提议做“女性角色观察”系列',text:'这个企划至少要做三个月，从不同作品中选一位角色认真分析。它可能让观众记住你，也可能让你被一个主题困住。',options:[
          {label:'认真规划，做成系列',hint:'长期涨粉潜力更大',effect:{energy:-15,skill:4,rep:4},quality:10,heat:5,viral:.04,flag:'series',line:'你把标题写进计划表，第一次有了真正属于自己的栏目。'},
          {label:'先做一集试水',hint:'风险较小，影响中等',effect:{energy:-9,skill:2},quality:6,heat:4,viral:.02,line:'第一集发出后，你认真记录观众最喜欢的部分。'},
          {label:'继续自由选题',hint:'保留变化，系列积累较少',effect:{energy:3,rep:1},quality:3,heat:1,viral:0,line:'你不想被计划表绑住，继续在不同题材之间找惊喜。'}]}
      ];
      const specialEvents={
        burnout:{title:'身体先按下了暂停键',text:'你连着几个月熬夜查资料和剪片，打开熟悉的作品也提不起兴趣。这个月必须改变节奏。',options:[
          {label:'停更一个月，认真休息',hint:'恢复大量精力，当月流量下降',effect:{energy:38,rep:2},quality:-22,heat:-15,viral:-.03,line:'你发了停更说明，走出房间晒了很久的太阳。'},
          {label:'请朋友帮忙分担剪辑',hint:'花钱，保住更新与精力',effect:{money:-350,energy:23,rep:3},quality:2,heat:1,viral:0,line:'你第一次把时间线交给别人，终于能睡个整觉。'},
          {label:'继续硬撑更新',hint:'可能保住播放，健康与口碑危险',effect:{energy:-15,rep:-7},quality:-8,heat:8,viral:.01,line:'视频如期发出，稿子里却多了几个你本不会犯的错误。'}]},
        trust:{title:'观众开始不信任你的分析',text:'前几次争议叠在一起，有人质疑你为了流量故意断章取义。评论区开始互相转发旧视频。',options:[
          {label:'逐期补充来源与勘误',hint:'费时，口碑明显恢复',effect:{energy:-16,rep:15,skill:3},quality:7,heat:-4,viral:0,line:'你认真改了错误，也把观点和事实分开讲清楚。'},
          {label:'发一条情绪化回应',hint:'短期讨论高，口碑可能更差',effect:{energy:-8,rep:-12},quality:-5,heat:22,viral:.03,line:'讨论声量更大了，愿意认真听你说话的人却更少。'},
          {label:'暂时不回应，换个话题',hint:'省力，信任修复缓慢',effect:{energy:8,rep:1},quality:-4,heat:-7,viral:-.01,line:'你先退后一步，争议慢慢降温，但问题还在。'}]},
        growth:{title:'编辑推荐邀请你做专题',text:'你的系列被编辑注意到，对方建议你做一期跨作品的女性角色专题，时间却很紧。',options:[
          {label:'查资料做完整专题',hint:'内容力与口碑提升，有机会破圈',effect:{energy:-19,skill:5,rep:6},quality:16,heat:14,viral:.09,line:'你把几部作品的线索并排摆开，专题让新观众认识了你。'},
          {label:'请同行一起做双人讨论',hint:'平衡工作量，增加曝光',effect:{energy:-12,rep:4,money:-120},quality:10,heat:12,viral:.05,line:'两种视角碰撞出新的问题，评论区也开始认真讨论。'},
          {label:'婉拒，先把手头系列做完',hint:'保住节奏，错过一次曝光',effect:{energy:7,rep:2},quality:4,heat:-4,viral:0,line:'你没有接下专题，却按自己的节奏完成了正在做的系列。'}]}
      };
      const card=document.getElementById('card'),hud=document.getElementById('hud'),runId=document.getElementById('run-id'),monthLabel=document.getElementById('month-label'),progress=document.getElementById('progress');
      let game;
      function rand(max){if(globalThis.crypto?.getRandomValues){const n=new Uint32Array(1);crypto.getRandomValues(n);return n[0]%max}return Math.floor(Math.random()*max)}
      function chance(){return rand(10000)/10000}
      function shuffle(items){const out=items.slice();for(let i=out.length-1;i>0;i--){const j=rand(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}
      function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
      function fmt(n){return Math.round(n).toLocaleString('zh-CN')}
      function makeGame(){const background=backgrounds[rand(backgrounds.length)];return {id:String(1000+rand(9000)),background,niche:null,month:0,phase:'start',deck:shuffle(events),works:shuffle(works),currentEvent:null,currentWork:null,currentTrend:null,currentAngle:null,specialSeen:{},followers:0,skill:background.skill,energy:background.energy,rep:background.rep,money:background.money,backup:false,series:false,history:[],last:null}}
      function prepareMonth(){const g=game;g.currentWork=g.works[g.month-1];g.currentAngle=g.currentWork.angles[rand(g.currentWork.angles.length)];g.currentTrend=trends[rand(trends.length)];if(g.energy<25&&!g.specialSeen.burnout){g.currentEvent=specialEvents.burnout;g.specialSeen.burnout=true}else if(g.rep<30&&!g.specialSeen.trust){g.currentEvent=specialEvents.trust;g.specialSeen.trust=true}else if(g.followers>3000&&g.month>=6&&!g.specialSeen.growth){g.currentEvent=specialEvents.growth;g.specialSeen.growth=true}else g.currentEvent=g.deck[g.month-1]}
      function actionButton(label,detail,index,primary=false,disabled=false){return `<button type="button" class="choice${primary?' primary':''}" data-index="${index}" ${disabled?'disabled':''}><span><strong>${label}</strong>${detail?`<small>${detail}</small>`:''}</span></button>`}
      function panel(label,title,text,buttons,extra=''){return `<div class="scene"><div class="scene-label">${label}</div><h2 id="scene-title" tabindex="-1">${title}</h2><div class="story">${text}</div><div class="choices">${buttons}</div>${extra}</div>`}
      function renderHud(){hud.replaceChildren();for(const [label,value] of [['粉丝',fmt(game.followers)],['内容力',game.skill],['精力',game.energy],['口碑',game.rep],['余额','¥'+fmt(game.money)],['方向',game.niche?.name||'待选择']]){const el=document.createElement('div');el.className='stat';const l=document.createElement('span');l.textContent=label;const b=document.createElement('b');b.textContent=value;el.append(l,b);hud.append(el)}}
      function ending(){
        const g=game;let title,desc;
        if(g.rep<25){title='争议流量的代价';desc='你确实被很多人看见了，却也开始不敢点开评论区。下一段路，需要先重新赢回信任。'}
        else if(g.energy<12){title='爆更之后，按下暂停';desc='你剪出了许多片子，也把自己剪得太疲惫。停下来不是失败，是给下一次创作留一点力气。'}
        else if(g.followers>=30000){title='破圈的影视解说新星';desc='你的人物分析被更多人看见，甚至有人开始引用你的观点。现在，最难的是继续做自己。'}
        else if(g.followers>=7000){title='稳定成长的 UP 主';desc='你有了会等更新的观众，也学会在数据和生活之间找到自己的节奏。'}
        else if(g.followers>=800){title='小众宝藏创作者';desc='数字不算夸张，但愿意看完的人越来越多。属于你的风格，正在慢慢成形。'}
        else {title='还在路上的新人';desc='这一年没有突然爆红，却留下了一整条学习曲线。下一次开局，或许会遇到完全不同的机会。'}
        return {title,desc}
      }
      function render(){
        const g=game;renderHud();runId.textContent='人生编号 #'+g.id;monthLabel.textContent=g.phase==='start'?'选择方向':g.phase==='end'?'一年后':`第 ${g.month} / 12 个月`;progress.style.width=(g.phase==='start'?0:g.phase==='end'?100:Math.round(g.month/12*100))+'%';
        let html='';
        if(g.phase==='start'){
          html=panel('开局 · 你只是一个普通人','第一条解说还没发出去',`<p>你的身份是<strong>${g.background.name}</strong>。${g.background.desc}</p><p>某天深夜，你看完一部作品，想从女性角色的经历聊起。你打开剪辑软件，决定认真试一年。没有团队，也没有观众。你的第一步是确定自己的分析方向。</p><div class="beat">每局会重新抽取身份、影视选题、事件顺序和投稿结果。每个选择都会改变后续的数据、事件与结局。</div>`,niches.map((n,i)=>actionButton(n.name,n.desc,i)).join(''));
        }else if(g.phase==='event'){
          const e=g.currentEvent;
          const context=g.energy<25?'你已经明显疲惫，继续硬撑会拖累作品质量。':g.money<250?'余额见底，任何花钱的决定都要认真权衡。':g.followers>5000?'现在有不少观众等着你的下一条更新。':'你还在摸索，任何一次尝试都可能带来转机。';
          html=panel(`第 ${g.month} 个月 · ${g.niche.name}`,e.title,`<p>本月选题是<strong>《${g.currentWork.title}》</strong>，你打算从<strong>${g.currentAngle}</strong>切入；这部作品${g.currentTrend.text}。</p><p>${e.text}</p><div class="beat">${context}</div><p>你会怎么做？</p>`,e.options.map((o,i)=>actionButton(o.label,o.hint,i,false,(o.effect.money||0)<0&&g.money<-(o.effect.money||0))).join(''));
        }else if(g.phase==='result'){
          const r=g.last;const delta=r.delta.map(d=>`<span class="${d.value>=0?'good':'bad'}">${d.label} ${d.value>0?'+':''}${fmt(d.value)}</span>`).join('');
          html=panel(`第 ${g.month} 个月 · 投稿结果`,r.title,`<p>${r.line}</p><div class="metrics"><div class="metric"><span>本月播放</span><b>${fmt(r.views)}</b></div><div class="metric"><span>新增粉丝</span><b>+${fmt(r.gained)}</b></div></div>${r.extra?`<div class="beat">${r.extra}</div>`:''}<p>你的决定留下了痕迹。下一月，新的事情正在发生。</p>`,actionButton(g.month===12?'查看一年后的结局':'进入下个月','',0,true),`<div class="delta">${delta}</div>`);
        }else{
          const end=ending();const recent=g.history.slice(-4).map(h=>`<p>第 ${h.month} 月 · 《${h.work}》：${h.choice}，新增 ${fmt(h.gained)} 位粉丝。</p>`).join('');
          html=panel('一年后 · 你的频道',end.title,`<p>${end.desc}</p><div class="beat">最终成绩：<strong>${fmt(g.followers)} 粉丝</strong> · 内容力 ${g.skill} · 口碑 ${g.rep} · 余额 ¥${fmt(g.money)}</div><p>每次重开，身份、作品、事件、运气和选择都会让路线重新分岔。</p>`,actionButton('再来一局全新人生','重新抽取所有选题和事件',0,true),`<div class="timeline"><h3>最后几个月</h3>${recent}</div>`);
        }
        card.innerHTML=html;if(g.phase!=='start')document.getElementById('scene-title').focus({preventScroll:true});
      }
      function applyChoice(index){
        const g=game,e=g.currentEvent,o=e.options[index];if(!o||(o.effect.money||0)<0&&g.money<-(o.effect.money||0))return;
        const before={skill:g.skill,energy:g.energy,rep:g.rep,money:g.money};
        for(const key of ['skill','energy','rep','money'])g[key]+=o.effect[key]||0;
        g.skill=clamp(g.skill,0,100);g.energy=clamp(g.energy,0,100);g.rep=clamp(g.rep,0,100);g.money=Math.max(0,g.money);
        if(o.flag==='backup')g.backup=true;if(o.flag==='series')g.series=true;
        const fatigue=g.energy<20?.55:g.energy<40?.78:1;
        const base=(190+g.followers*.66+g.skill*23+g.rep*9)*g.niche.boost*g.currentTrend.boost*(g.backup?1.04:1)*(1+(o.quality+o.heat)/100)*fatigue;
        let views=Math.max(80,Math.round(base*(.62+chance()*1.05)));
        const viralChance=clamp(.035+g.skill/1100+g.rep/1800+(o.viral||0)+(g.series?.025:0),.01,.32);
        const viral=chance()<viralChance;
        if(viral)views=Math.round(views*(3.2+chance()*7));
        let extra=viral?'这期解说被更多人刷到，评论提醒响个不停。':'';
        if(g.niche.risk&&chance()<g.niche.risk+(o.copyright||0)){
          const loss=Math.round(views*.45);views-=loss;g.rep=clamp(g.rep-7,0,100);extra+=' 素材版权提醒让播放受限，口碑也受到影响。';
        }
        if(g.backup)extra+=' 规范的备份流程让后续制作更稳定。';
        let gained=Math.max(1,Math.round(views*(.012+g.rep/3000+(o.quality||0)/4000)));
        if(g.series)gained=Math.round(gained*1.08);
        g.followers+=gained;
        g.energy=clamp(g.energy+7,0,100);
        g.money=Math.max(0,g.money-70);
        const delta=[['内容力','skill'],['精力','energy'],['口碑','rep'],['余额','money']].map(([label,key])=>({label,value:g[key]-before[key]})).filter(x=>x.value!==0);
        g.last={title:viral?'这次，真的被看见了':views<1000?'小小的一步，也算前进':'这期解说发出去了',line:o.line,views,gained,extra,delta};
        g.history.push({month:g.month,event:e.title,work:g.currentWork.title,choice:o.label,gained});g.phase='result';render();
      }
      card.addEventListener('click',event=>{
        const target=event.target.closest('[data-index]');if(!target)return;const index=Number(target.dataset.index);const g=game;
        if(g.phase==='start'){const niche=niches[index];if(!niche)return;g.niche=niche;g.skill=clamp(g.skill+niche.skill,0,100);g.energy=clamp(g.energy+niche.energy,0,100);g.rep=clamp(g.rep+niche.rep,0,100);g.month=1;g.phase='event';prepareMonth();render();}
        else if(g.phase==='event')applyChoice(index);
        else if(g.phase==='result'){if(g.month===12){g.phase='end'}else{g.month++;g.phase='event';prepareMonth()}render();}
        else if(g.phase==='end'){game=makeGame();render();window.scrollTo({top:0,behavior:'smooth'});}
      });
      document.getElementById('reset').addEventListener('click',()=>{game=makeGame();render();window.scrollTo({top:0,behavior:'smooth'})});
      game=makeGame();render();
    })();
  </script>
</body>
