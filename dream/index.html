<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14182b"><title>把喜欢剪成光 · UP 主成长故事</title><style>:root{color-scheme:dark;--bg:#101422;--paper:#1d2338;--ink:#f3f1ee;--muted:#a8afc3;--gold:#f5cd85;--line:#39405a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#38304e 0,transparent 55%),var(--bg);color:var(--ink);font:16px/1.75 system-ui,-apple-system,"Microsoft Yahei",sans-serif;min-height:100vh}.shell{max-width:1120px;margin:auto;padding:30px 40px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{color:var(--ink);text-decoration:none;letter-spacing:2px;font-weight:600}.brand span{display:block;color:var(--muted);font-size:12px;letter-spacing:3px}button,input{font:inherit}button{cursor:pointer;transition:background .2s,transform .2s}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.quiet{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 14px;border-radius:20px;font-size:14px}.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:65px;align-items:center;min-height:65vh}.eyebrow{color:var(--gold);font-size:14px;letter-spacing:3px}h1,h2{font-family:"Noto Serif SC",Georgia,serif;line-height:1.45;font-weight:600}h1{font-size:clamp(36px,5vw,58px);margin:20px 0}h2{font-size:30px;margin:10px 0 20px}p{margin:14px 0}.sub{color:var(--muted)}.primary{background:var(--gold);border:0;border-radius:7px;padding:13px 28px;color:#292232;font-weight:600}.primary:hover{background:#ffdda1;transform:translateY(-2px)}label{display:block;color:var(--muted);font-size:14px;margin:26px 0 8px}input{background:#151a2c;border:1px solid var(--line);color:var(--ink);padding:12px 15px;border-radius:6px;width:100%;max-width:310px;margin-bottom:18px}.opening-note{padding:35px;border:1px solid var(--line);background:linear-gradient(140deg,#2a2d45,#191f33);border-radius:8px;transform:rotate(2deg);box-shadow:0 25px 60px #0004}.opening-note h3{font-family:serif;font-size:25px;color:var(--gold);margin-top:0}.timeline{display:flex;gap:5px;align-items:end;height:80px;margin:24px 0}.clip{height:34px;background:#9584bc80;border-radius:3px;flex:1}.clip:nth-child(2n){background:#e9ba6c80;height:50px}.clip:nth-child(3n){background:#728eac80;height:25px}.timecode{font-family:monospace;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:36px}.story{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:34px}.chapter{font-size:14px;color:var(--gold);letter-spacing:2px}.story p{line-height:1.95}.choices{display:grid;gap:12px;margin-top:28px}.choice{text-align:left;color:var(--ink);border:1px solid #525974;border-radius:6px;background:#242b43;padding:16px 20px}.choice:hover{background:#343c57;border-color:var(--gold)}.choice small{display:block;color:var(--muted);font-size:14px;margin-top:3px}.stats{padding:24px 0}.stats h3{font-weight:500;margin:0 0 22px}.stat{margin:18px 0;font-size:14px}.stat-head{display:flex;justify-content:space-between;color:var(--muted)}.bar{height:5px;background:#2a3045;margin-top:9px;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.log{border-top:1px solid var(--line);margin-top:25px;padding-top:20px;font-size:14px;color:var(--muted)}.log p{margin:12px 0}.progress{display:flex;gap:4px;margin:0 0 23px}.progress i{height:3px;background:#353c53;flex:1}.progress i.done{background:var(--gold)}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 12px;color:var(--muted);font-size:14px;margin:4px}.result{border-left:3px solid var(--gold);padding:8px 20px;background:#f5cd8508;margin:24px 0}.ending-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.ending-card{border:1px solid var(--line);padding:15px;border-radius:6px;font-size:14px;color:var(--muted)}.ending-card.unlocked{color:var(--gold);border-color:#a18b61}footer{color:#8e96ae;text-align:center;font-size:14px;padding:36px 0 12px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.note{font-size:14px;color:var(--muted)}@media(max-width:760px){.shell{padding:20px}.intro{grid-template-columns:1fr;gap:35px}.opening-note{transform:none;padding:26px}.layout{grid-template-columns:1fr;gap:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;padding:14px 0}.stats h3,.stats .log,.stats .quiet{grid-column:1/-1}.story{padding:24px 20px}.layout .stats{order:-1}.stats .log{display:none}.stats h3{margin:0}.stat{margin:9px 0}header{margin-bottom:28px}.ending-grid{grid-template-columns:1fr}h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><div class="shell"><header><a class="brand" href="./">把喜欢剪成光<span>A CREATOR'S STORY</span></a><button id="sound" class="quiet" aria-pressed="false">氛围音 · 关</button></header><main id="app"></main><footer>献给每一个认真看故事、也努力写自己故事的人。</footer></div><script>'use strict';
const $=s=>document.querySelector(s),KEY='up-dream-v1';
const books=[['花束般的恋爱','相似的人，为什么也会渐渐走散？','你在两个人的沉默里，看见了日常如何改变爱情。'],['知否','明兰的清醒，是天生的还是一点点学会的？','你把人物的每一次退让和争取，放回她当时的处境。'],['婚姻故事','爱还在，为什么对话却变成了伤害？','你发现有些争吵里，藏着没能被好好说出来的需求。'],['重启人生','重来一次，我们会把什么留在生活里？','你记下那些不起眼的友情、饭局和普通的一天。'],['爱乐之城','梦想与爱情，真的只能二选一吗？','你没有急着给答案，而是看向两个人各自走过的路。']];
const names={skill:'表达',trust:'信任',energy:'精力',money:'生活余额'};
const choice=(text,hint,effects,flag)=>({text,hint,effects,flag});
let state=null,pending=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function write(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(name){state={name:name.trim().slice(0,16)||'小光',step:0,stats:{skill:25,trust:20,energy:75,money:65},fans:12,flags:[],history:[],topic:Math.floor(Math.random()*5),randoms:[],ending:null};write();render()}
function scenes(){const b=books[state.topic],n=esc(state.name),f=state.flags;return [
{title:'今晚，先成为一个开始的人',text:`下班后的地铁上，你又看了一遍自己的收藏夹。那些关于人物和感情的长评，让你忍不住想说点什么。回到家，电脑屏幕亮起。${n}，你不再只想做故事的观众。`,choices:[choice('从最打动我的作品开始','先把真正想说的话写下来。',{skill:8,trust:4,energy:-6},'heart'),choice('研究热门视频，找到入口','理解观众如何被一个问题吸引。',{skill:4,trust:2,energy:-5},'research'),choice('先做一支一分钟练习','不等准备完美，先完成一次。',{skill:6,energy:-3},'practice')]},
{title:`选题：《${b[0]}》`,text:`笔记本上，你写下一个问题：${b[1]}\n${b[2]}你想让第一次点进来的观众，也愿意陪你一起想。`,choices:[choice('从一个人物的细节切入','用一场戏、一句回应，慢慢展开。',{skill:10,trust:8,energy:-9},'detail'),choice('把人物关系画成分析提纲','先厘清动机，再给出自己的理解。',{skill:12,trust:5,energy:-10},'structure'),choice('从自己的感情体验说起','真实的共鸣，也为自己保留边界。',{skill:6,trust:11,energy:-7},'personal')]},
{title:'稿子里的第一个分岔',text:'写到一半，你发现同一个人物，也可以被讲成截然不同的样子。一个“她太自私了”的标题很抓眼球，但你知道，那场戏之前还有漫长的铺垫。',choices:[choice('保留复杂性，解释她的处境','给人物留一点被理解的空间。',{skill:8,trust:12,energy:-8},'nuance'),choice('给出鲜明观点，也放入反证','可以有立场，也可以承认解释的边界。',{skill:10,trust:7,energy:-6},'argument'),choice('用更激烈的标题试水','更容易被看见，也可能被误读。',{trust:-8,energy:-3,fans:85},'clickbait')]},
{title:'时间线，终于开始流动',text:'录音里有呼吸声，字幕总是差半拍。你把同一段剪了七次。凌晨一点，光标停在导出按钮旁边，明天还要早起。',choices:[choice('只修最影响观看的三处，然后睡觉','完成也是一种能力。',{skill:6,energy:5},'boundary'),choice('继续精修，直到这一段满意','愿意下功夫，也要承担疲惫。',{skill:14,energy:-22},'polish'),choice('删掉花哨转场，让讲述更清晰','把注意力交还给人物和分析。',{skill:10,trust:4,energy:-5},'clear')]},
{title:'第一支视频：已发布',text:`《${b[0]}》的分析终于出现在主页上。你刷新了几次：播放量缓慢增加，一条评论说，“这个细节我之前没注意到”。还有人说你的节奏太慢。`,choices:[choice('认真回复那条具体的反馈','有人在屏幕另一端接住了你的表达。',{trust:12,energy:-4,fans:30},'reply'),choice('记录前一分钟的观看表现','把反馈变成下一次可以改的细节。',{skill:10,energy:-5,fans:20},'data'),choice('暂时关掉数据，去吃一顿热饭','作品发出去了，生活也需要继续。',{energy:14,money:-4},'rest')]},
{title:'第二个故事，还是自己的声音',text:`你想尝试《${books[(state.topic+1)%5][0]}》。${f.includes('detail')?'上一支视频里对细节的观察，成了观众记住你的理由。':f.includes('clickbait')?'有人是被标题吸引来的，他们期待你下一次也给出一个干脆的判断。':'第一支视频还很生涩，但你已经知道自己能完成一个作品。'}下一步，怎么走？`,choices:[choice('做一个人物关系的小系列','让前后两支视频形成对话。',{skill:8,trust:10,energy:-9,fans:55},'series'),choice('试试新的叙事和剪辑节奏','允许自己有一段不熟练的时期。',{skill:13,energy:-10,fans:25},'experiment'),choice('追一个热议话题，补足资料再发布','热度是机会，理解仍需要时间。',{skill:6,trust:4,energy:-12,fans:90},'trend')]},
{title:'普通生活，也在催你交稿',text:'工作临时加了任务，洗衣篮满了，新的分析稿还差一半。你看着原定的更新日期，第一次觉得喜欢的事情也有重量。',choices:[choice('把长视频拆成上下两期','缩小这次的工作量，认真完成一半。',{skill:5,energy:9,trust:4},'pace'),choice('说明延期，给自己一个周末','一次延期不会抹掉之前的努力。',{energy:18,trust:3,money:-5},'boundary'),choice('请朋友帮忙校对和字幕','学会合作，也保留自己的表达。',{skill:7,energy:8,money:-15,trust:6},'help')]},
{title:'评论区里的另一种理解',text:`一位观众写了很长的反驳，认为你对人物的理解忽略了另一段剧情。${f.includes('nuance')?'你曾经给人物留出复杂的空间，现在也试着给不同意见留一个位置。':'看到质疑时，你的心还是往下一沉。'}你重新打开那场戏。`,choices:[choice('核对后补充说明，感谢具体指正','承认遗漏，让分析变得更完整。',{skill:9,trust:14,energy:-7},'honest'),choice('解释自己的角度，承认可以有不同理解','把争论变成一次交流。',{skill:6,trust:9,energy:-5},'dialogue'),choice('暂时不回复，先整理自己的情绪','等情绪平稳，再决定是否继续对话。',{energy:12,trust:1},'calm')]},
{title:'一封合作邀约',text:'邮箱里出现了第一封商业合作。对方愿意付费，希望你把产品推荐放进下一支感情分析视频。报酬能缓解生活压力，但你有些拿不准。',choices:[choice('只接受试用后认可的合作，明确标注','收入和观众信任，都需要认真对待。',{money:24,trust:7,energy:-6},'ethical'),choice('这次婉拒，先做完正在写的故事','给自己的创作留出完整空间。',{trust:9,skill:4,energy:3},'independent'),choice('商量独立广告段，不干预分析观点','为创作争取一个可持续的条件。',{money:30,trust:3,energy:-7},'business')]},
{title:'那支一直想做的视频',text:`你想重新谈谈《${b[0]}》。这一次，你已经不满足于解释剧情。你想讲清楚一个人如何在亲密关系里找回自己的声音。${f.includes('personal')?'你在初稿旁边写下：真实不等于把所有私事公开。':'稿纸的空白，让你想起自己刚开始的那个晚上。'}`,choices:[choice('重新看片、查资料，把论证做扎实','这会是一次更有重量的表达。',{skill:15,trust:10,energy:-16},'masterwork'),choice('做一次温柔的个人表达','用自己的语言，讲出理解后的感受。',{skill:8,trust:14,energy:-10},'voice'),choice('邀请观众一起回答结尾的问题','留一处空白，让他们的故事走进来。',{trust:16,energy:-7,fans:65},'community')]},
{title:'有人说：你讲到了我的心里',text:'新视频的评论里，有人讲起自己结束的一段关系，有人说开始重新理解母亲。播放量并没有说明全部。你突然意识到，认真看待一个人物，也可能帮另一个人理解自己。',choices:[choice('认真读评论，但不承担所有人的情绪','共鸣可以发生，边界也值得被尊重。',{trust:10,energy:8},'boundary'),choice('把大家的问题整理成下一期选题','和观众一起，让讨论继续生长。',{skill:8,trust:13,energy:-8,fans:55},'community'),choice('和身边的人分享这份喜悦','今天不剪了，一起庆祝一下。',{energy:17,money:-6,trust:4},'life')]},
{title:'下一季，你想怎么继续',text:`又过了一个普通的晚上。主页上已经有了一排作品，${n}依然会紧张、会卡稿，也会在某个镜头前突然眼睛发亮。成为 UP 主没有一个统一的终点。这一次，你想把什么放在最前面？`,choices:[choice('建立能长期坚持的更新节奏','给梦想和生活都留位置。',{energy:12,trust:8},'sustainable'),choice('继续打磨属于我的人物分析','让作品慢慢长出清晰的声音。',{skill:12,trust:8,energy:-8},'author'),choice('尝试把创作变成更稳定的职业','制定预算和计划，走向更大的舞台。',{money:12,skill:6,energy:-7,fans:80},'career')]}
]}
const events=[{title:'一个意外的收藏',text:'一位不认识的观众把你的视频发给了朋友：“她真的有认真看这个人物。”',effects:{trust:6,fans:45}}, {title:'素材突然丢了',text:'剪辑软件意外退出。你重新整理素材，也建立了备份习惯。',effects:{skill:5,energy:-8}}, {title:'散步时想通的一句话',text:'楼下的风吹过来，你终于找到一个不用术语也能讲清楚的开场。',effects:{skill:7,energy:5}}, {title:'推荐流的一阵风',text:'旧视频突然被更多人看到。有惊喜，也有一些与你观点不同的新面孔。',effects:{fans:150,trust:3,energy:-4}}, {title:'一个安静的更新日',text:'这次数据平平。你检查了声音和字幕，记下一条改进，然后照常吃晚饭。',effects:{skill:4,energy:3}}, {title:'有人陪你坐一会儿',text:'身边的人带来一杯热饮：“你慢慢做，我想听你讲。”你不必一个人扛住每个晚上。',effects:{energy:13,trust:3}}, {title:'设备的小状况',text:'麦克风开始有杂音。你买了一个基础替代品，先把声音录清楚。',effects:{money:-10,skill:3}}, {title:'重看时的新发现',text:'同一场戏，隔了一段时间再看，竟然读出了新的心情。你把它记进选题本。',effects:{skill:8,trust:3}}];
function apply(e){for(const k of Object.keys(names))state.stats[k]=Math.max(0,Math.min(100,state.stats[k]+(e[k]||0)));if(e.fans)state.fans+=e.fans}
function choose(i){const s=scenes()[state.step],c=s.choices[i];apply(c.effects);if(c.flag)state.flags.push(c.flag);const reach=Math.round(8+state.stats.skill*.4+state.stats.trust*.3+Math.random()*25);state.fans+=reach;state.history.push({title:s.title,text:c.text});state.step++;pending={title:'这一刻，故事往前走了一点',text:c.hint,effects:c.effects};if([2,4,6,8,10].includes(state.step)){const unused=events.map((_,i)=>i).filter(i=>!state.randoms.includes(i));const id=unused[Math.floor(Math.random()*unused.length)];state.randoms.push(id);apply(events[id].effects);pending.event=events[id]}write();renderOutcome()}
function sidebar(){return `<aside class="stats"><h3>${esc(state.name)}的创作手记</h3>${Object.keys(names).map(k=>`<div class="stat"><div class="stat-head"><span>${names[k]}</span><span>${state.stats[k]} / 100</span></div><div class="bar"><i style="width:${state.stats[k]}%"></i></div></div>`).join('')}<div class="stat"><div class="stat-head"><span>关注你的人</span><span>${state.fans}</span></div></div><div class="log"><span>最近的选择</span>${state.history.slice(-3).map(h=>`<p>${esc(h.text)}</p>`).join('')||'<p>故事从你开始的这一刻写起。</p>'}</div><button class="quiet" id="restart">重新开始</button></aside>`}
function frame(content){$('#app').innerHTML=`<div class="layout"><section class="story"><div class="progress" aria-label="已完成 ${state.step} / 12 阶段">${Array.from({length:12},(_,i)=>`<i class="${i<state.step?'done':''}"></i>`).join('')}</div>${content}</section>${sidebar()}</div>`;$('#restart').onclick=()=>{pending=null;intro(true)};window.scrollTo({top:0,behavior:'instant'})}
function render(){pending=null;if(state.step>=12){ending();return}const s=scenes()[state.step];frame(`<div class="chapter">第 ${String(state.step+1).padStart(2,'0')} 幕 / 12</div><h2>${s.title}</h2>${s.text.split('\n').map(p=>`<p>${p}</p>`).join('')}<div class="choices">${s.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${c.text}<small>${c.hint}</small></button>`).join('')}</div>`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)))}
function effectText(e){return Object.entries(e).map(([k,v])=>`${names[k]||'关注'} ${v>0?'+':''}${v}`).join(' · ')}
function renderOutcome(){frame(`<div class="chapter">选择的回声</div><h2>${pending.title}</h2><p>${pending.text}</p><p class="note">${effectText(pending.effects)}</p>${pending.event?`<div class="result"><div class="chapter">随机插曲</div><h2>${pending.event.title}</h2><p>${pending.event.text}</p><p class="note">${effectText(pending.event.effects)}</p></div>`:''}<button class="primary" id="next">${state.step>=12?'翻到这一季的结尾':'继续故事'}</button><p class="note">进度已保存。本次成长不以关注数作为唯一答案。</p>`);$('#next').onclick=render}
const endings=[['pause','把光留给明天','你把更新计划暂时放下，好好休息。停止透支不是放弃梦想，而是在为下一次出发保存力量。那支未完成的稿子，仍可以等你。'],['balance','生活与梦想，同一条时间线','你找到了能够持续的节奏：有工作、有热饭，也有一支支认真完成的视频。梦想不是突然替换生活，而是慢慢在生活里有了位置。'],['author','属于你的那束光','你的分析长出了自己的语言。观众会因为你的名字点开视频，想听听你如何理解一个人物。你仍是普通人，却已经拥有了独特的表达。'],['career','向更大的银幕走去','你开始用预算、合作和计划托住创作。职业的道路还有不确定，但你已经有作品、有观众，也有继续走下去的具体办法。'],['community','有人在故事里认出了自己','你的评论区成了一个愿意认真聊天的地方。人们带着自己的经历来，也带着一点被理解的感觉离开。这份连接，是作品之外的另一束光。'],['growing','未完待续的创作者','你还没有把一切做好，但已经完成了从“想做”到“在做”的变化。每次重看、重写、重剪，都留下了一点进步。故事还没有结束。']];
function getEnding(){const s=state.stats,f=state.flags;if(s.energy<24)return endings[0];if(f.includes('sustainable')&&s.energy>=50)return endings[1];if(f.includes('career')&&s.money>=65&&s.skill>=65)return endings[3];if(f.filter(x=>x==='community').length>=2&&s.trust>=75)return endings[4];if(s.skill>=85&&s.trust>=70)return endings[2];return endings[5]}
function ending(){const e=getEnding();state.ending=e[0];let unlocked;try{unlocked=JSON.parse(localStorage.getItem('up-dream-endings')||'[]');if(!unlocked.includes(e[0]))unlocked.push(e[0]);localStorage.setItem('up-dream-endings',JSON.stringify(unlocked))}catch{unlocked=[e[0]]}write();frame(`<div class="chapter">这一季的结尾 · ${esc(state.name)}</div><h2>${e[1]}</h2><p>${e[2]}</p><div class="result"><p>给正在努力成为 UP 主的你：</p><p>你认真看过的那些人物、反复调整的那些字幕、删掉又写回的句子，都不是白费。愿你能把喜欢的事慢慢做下去，也记得照顾那个努力的自己。无论这个故事走到哪里，都有人期待听见你的声音。</p></div><p class="note">这局的选择：${state.history.map(h=>esc(h.text)).join(' / ')}</p><div class="actions"><button class="primary" id="again">再写一种人生</button><button class="quiet" id="download">保存这季手记</button></div><h3>结局收藏 · ${unlocked.length} / 6</h3><div class="ending-grid">${endings.map(x=>`<div class="ending-card ${unlocked.includes(x[0])?'unlocked':''}">${unlocked.includes(x[0])?x[1]:'尚未写到的故事'}</div>`).join('')}</div><p class="note">不同选择会通往不同结局。随机事件会改变际遇，你的选择决定如何回应。此游戏是虚构成长故事，作品名仅作为分析选题。</p>`);$('#again').onclick=()=>intro(true);$('#download').onclick=()=>{const txt=`把喜欢剪成光\n${state.name} · ${e[1]}\n\n${e[2]}\n\n`+state.history.map((h,i)=>`${i+1}. ${h.title}\n${h.text}`).join('\n\n');const u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='我的创作手记.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
function intro(reset=false){const saved=read();$('#app').innerHTML=`<section class="intro"><div><div class="eyebrow">互动故事 / 随机际遇 / 多种人生</div><h1>把喜欢的故事，<br>剪成自己的光。</h1><p class="sub">白天过着普通的生活，晚上把心事写进时间线。<br>从第一支影视分析视频开始，走一段属于你的 UP 主成长路。</p><label for="name">这次故事里的你，叫什么？</label><input id="name" maxlength="16" placeholder="小光" autocomplete="off"><div class="actions" style="margin-top:0"><button id="start" class="primary">开始我的故事</button>${saved&&!reset?'<button id="continue" class="quiet">继续上次的故事</button>':''}${saved&&reset?'<button id="back" class="quiet">回到当前故事</button>':''}</div><p class="note">约 10–15 分钟 · 12 幕故事 · 6 种结局<br>每一次开始，都会遇见不一样的小插曲。</p></div><div class="opening-note"><div class="timecode">PROJECT_01 / 我的第一支视频</div><h3>“我想讲的，<br>不只是一个爱情故事。”</h3><p class="sub">花束般的恋爱 · 知否 · 婚姻故事<br>重启人生 · 爱乐之城</p><div class="timeline" aria-hidden="true">${'<div class="clip"></div>'.repeat(9)}</div><p>某个镜头里，你看见了自己。<br>而这一次，轮到你被听见。</p><div class="timecode">00:00:00 / 从这里开始</div></div></section>`;$('#start').onclick=()=>start($('#name').value);$('#name').onkeydown=e=>{if(e.key==='Enter')start($('#name').value)};if($('#continue'))$('#continue').onclick=()=>{state=saved;render()};if($('#back'))$('#back').onclick=()=>{state=saved;render()}}
let audioCtx=null,oscillators=[];$('#sound').onclick=()=>{if(audioCtx){audioCtx.close();audioCtx=null;oscillators=[];$('#sound').textContent='氛围音 · 关';$('#sound').setAttribute('aria-pressed','false');return}try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const gain=audioCtx.createGain();gain.gain.value=.015;gain.connect(audioCtx.destination);[130.81,196,261.63,329.63].forEach((f,i)=>{const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=i*2;o.connect(gain);o.start();oscillators.push(o)});$('#sound').textContent='氛围音 · 开';$('#sound').setAttribute('aria-pressed','true')}catch{$('#sound').textContent='此浏览器不支持氛围音'}};
intro();
</script></body></html>
