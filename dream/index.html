t-size:14px}.intro{display:grid;grid-template-columns:1.15fr 1fr;gap:55px;align-items:center;padding:35px 0}.letter{background:var(--paper);padding:34px;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;transform:rotate(1deg);position:relative}.letter:before{content:'';display:block;width:90px;height:20px;background:#ebcda3aa;position:absolute;top:-10px;left:calc(50% - 45px);transform:rotate(-5deg)}.letter p{line-height:2}.sign{text-align:right;color:var(--rose)}label{display:block;font-size:14px;color:var(--muted);margin:20px 0 6px}input{background:var(--paper);color:var(--ink);padding:12px 15px;border:1px solid var(--line);border-radius:10px;max-width:290px;width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px}.welcome h2{margin:0;font-size:25px}.week{color:var(--rose);font-size:14px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.stat{background:#fffaf1;border:1px solid var(--line);padding:12px 15px;border-radius:12px}.stat span{display:block;font-size:13px;color:var(--muted)}.stat strong{font-size:20px;font-weight:600}.bar{height:4px;background:#e9dfcf;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}.tabs{display:flex;gap:7px;margin:22px 0;overflow:auto;padding-bottom:3px}.tab{border:1px solid var(--line);background:transparent;padding:10px 16px;border-radius:24px;color:var(--muted);white-space:nowrap;min-height:44px}.tab.active{background:var(--green);border-color:var(--green);color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{font-size:13px;padding:3px 10px;border-radius:14px;background:#f2e1cc;color:#715442;display:inline-block}.slots{display:flex;gap:6px}.slots i{width:16px;height:16px;border-radius:50%;border:1px solid #bc9c7d;background:#e6c7a7}.slots i.used{background:#eee6da;border-color:#d9cbbb}.project{border:1px solid #d6ba9c;border-radius:12px;background:#fff7e9;padding:20px;margin:18px 0}.project h3{margin-top:8px}.stages{display:flex;gap:8px;margin:15px 0}.stage{flex:1;text-align:center;font-size:14px;color:var(--muted);border-bottom:3px solid #e1d5c5;padding:5px 0}.stage.done{color:var(--green);border-color:var(--green)}.stage.current{color:var(--rose);border-color:var(--rose)}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fffcf5;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:15px;text-align:left;min-height:85px;display:block;width:100%}.choice:hover:enabled{background:#f8ecdc;transform:translateY(-1px)}.choice strong{display:block;font-weight:600}.choice small{display:block;font-size:14px;color:var(--muted);line-height:1.6;margin-top:5px}.choice.selected{border:2px solid var(--rose);background:#fae9db}.log-item{border-bottom:1px dashed var(--line);padding:14px 0}.log-item:last-child{border:0}.log-item p{margin:5px 0}.message{border-left:3px solid var(--rose);background:#faeadd;padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0}.message p{margin:4px 0}.event{max-width:760px;margin:20px auto}.event .choices{display:grid;gap:12px;margin:20px 0}.event .choice{min-height:70px}.film-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.film{padding:20px 15px;background:#fff8ed;border:1px solid var(--line);border-radius:12px}.film.selected{border:2px solid var(--rose);background:#f8e3d0}.film h3{font-size:19px}.film .note{min-height:44px}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}.result-card{background:#f2eadc;border:1px solid var(--line);padding:20px;border-radius:12px;margin:15px 0}.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.locked{color:var(--muted);background:#f5efe6}.unlocked{color:var(--green);background:#e9edde}.season-progress{height:5px;border-radius:4px;background:#e6d9c8;overflow:hidden}.season-progress i{display:block;height:100%;background:var(--rose)}details{font-size:14px;color:var(--muted);margin:15px 0}summary{cursor:pointer;min-height:36px}footer{text-align:center;font-size:14px;color:var(--muted);padding:35px 0 8px}.ending{max-width:800px;margin:20px auto}.ending .letter{transform:none;margin-top:24px}button.danger{color:#995347}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:white;border-radius:12px;padding:12px 20px;max-width:calc(100% - 30px);box-shadow:var(--shadow);z-index:10}.small{font-size:14px}.cut{margin:24px 0;border:0;border-top:1px dashed var(--line)}@media(max-width:700px){.shell{padding:18px 16px}header{align-items:flex-start;margin-bottom:20px}.brand{font-size:20px}.brand span{font-size:12px}.quiet{padding:8px 12px}.intro{grid-template-columns:1fr;gap:30px;padding:15px 0}.letter{padding:25px;transform:none}.grid{grid-template-columns:1fr;gap:18px}.paper{padding:20px}.stats{grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.stat{padding:8px 11px}.stat strong{font-size:18px}.stats .stat:nth-last-child(-n+2){grid-column:span 1}.welcome{align-items:start}.welcome h2{font-size:22px}.welcome p{margin:4px 0}.film-grid{grid-template-columns:1fr 1fr}.choice-grid{gap:8px}.choice{padding:13px}.tabs{margin:16px 0}.tab{padding:9px 13px;font-size:14px}.project{padding:16px}.film{padding:15px}.film .note{min-height:0}.outcomes{grid-template-columns:1fr}h2{font-size:25px}.event{margin:0}.intro .actions{margin-top:15px}}@media(max-width:360px){.choice-grid,.film-grid{grid-template-columns:1fr}.brand{font-size:18px}.welcome{display:block}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:8px}.paper{padding:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header><a href="./" class="brand">把喜欢剪成光 <span>你的创作生活手账</span></a><button id="sound" class="quiet" aria-pressed="false">♫ 氛围音 · 关</button></header><main id="app"></main><footer>献给正在努力的你。梦想可以慢慢来，你也值得被好好照顾。</footer></div><script>'use strict';
const $=s=>document.querySelector(s),KEY='up-dream-life-v2',WEEKS=16;
const films=[
{id:'bouquet',name:'花束般的恋爱',theme:'相爱与走散',question:'为什么那么相似的人，也会走向不同的生活？',color:'🌷'},
{id:'minglan',name:'知否',theme:'女性成长与关系',question:'明兰的清醒，是如何在一次次选择里长出来的？',color:'🍃'},
{id:'marriage',name:'婚姻故事',theme:'亲密关系与沟通',question:'爱还在的时候，为什么我们仍会伤害彼此？',color:'✉️'},
{id:'restart',name:'重启人生',theme:'友情与普通日常',question:'如果能重来，哪些小事才是值得留住的？',color:'🍮'},
{id:'lalaland',name:'爱乐之城',theme:'梦想与爱情',question:'追逐梦想的时候，怎样理解那些没能同行的人？',color:'🌙'}];
const angles=[{id:'detail',name:'从细节读人物',hint:'一场戏、一句回应，慢慢靠近人物。',quality:8,trust:8},{id:'relation',name:'拆解亲密关系',hint:'让人物的处境、需求与冲突连起来。',quality:5,trust:12},{id:'voice',name:'写进自己的感受',hint:'真诚地共鸣，也留好自己的边界。',quality:3,trust:14},{id:'debate',name:'提出一个新观点',hint:'更有讨论度，需要足够的资料支撑。',quality:10,trust:3}];
const origins=[{name:'下班后的创作者',text:'白天的工作已经很忙，创作是你留给自己的小小世界。',energy:70,money:340,skill:24,bonus:'work'}, {name:'在读书，也在写故事',text:'课业之间，你开始把收藏夹里的长评变成作品。',energy:84,money:220,skill:22,bonus:'learn'}, {name:'给自己一次新的尝试',text:'攒下一点积蓄，你决定认真试一季创作，再看看自己的路。',energy:78,money:460,skill:18,bonus:'create'}];
const traits=[{name:'细节观察者',text:'你总能注意到镜头里没被说出的情绪。研究素材时多一点收获。',bonus:'research'},{name:'共情的小耳朵',text:'你愿意听别人讲，也容易把人物当成真实的人。观众交流更容易建立信任。',bonus:'reply'},{name:'慢慢来的完美主义者',text:'你愿意把作品磨亮，也需要练习给自己留一点余地。精修收益更高。',bonus:'polish'}];
const endingList=[['rest','先把自己抱好','这一季，你发现自己的精力也需要被认真对待。你给更新按下暂停，给生活留出呼吸。梦想不会因为一段休息，就失去重新开始的可能。'],['sustain','梦想住进了日常','你完成了几支作品，也找到能继续下去的节奏。有人等你更新，你也依然能散步、吃热饭。梦想开始成为生活里稳定的一部分。'],['author','你的声音，被认出来了','你的分析有了自己的辨识度。人们不只为某部作品而来，也想听听你如何看待一个人、一段关系。那些认真打磨的夜晚，慢慢连成了光。'],['career','给梦想一张更大的书桌','你用作品、合作和预算托住创作，开始认真考虑它成为职业的可能。下一季仍有未知，但这次，你有了更具体的底气。'],['community','这里有人，愿意认真听','有人在你的分析里认出了自己，也有人因此开始理解另一个人。你经营起一个愿意好好说话的小小角落，连接成了创作的另一种回报。'],['start','故事才刚刚开始','你从收藏夹走到了发布页。也许作品还不多，表达仍有生涩，但你已经把“以后想做”变成了“现在正在做”。下一季，还有新的镜头等着你。']];
let state=null,tab='week',draftFilm=null,draftAngle='detail',toastTimer,lastView=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saved(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.version===2?s:null}catch{return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function rng(){state.seed=(Math.imul(1664525,state.seed)+1013904223)>>>0;return state.seed/4294967296}
function roll(a,b){return Math.floor(a+rng()*(b-a+1))}
function pick(a){return a[Math.floor(rng()*a.length)]}
function film(id){return films.find(f=>f.id===id)}
function angle(id){return angles.find(a=>a.id===id)}
function clamp(){for(const k of ['energy','skill','trust','heart'])state[k]=Math.max(0,Math.min(100,Math.round(state[k])));state.money=Math.max(0,Math.round(state.money));state.fans=Math.max(0,Math.round(state.fans))}
function change(e){for(const [k,v]of Object.entries(e||{}))state[k]+=v;clamp()}
function delta(e){const labels={energy:'精力',money:'余额',skill:'表达',trust:'信任',heart:'心情',fans:'关注'};return Object.entries(e).map(([k,v])=>`${labels[k]} ${v>=0?'+':''}${v}${k==='money'?' 元':''}`).join(' · ')}
function log(title,text,type='life'){state.diary.unshift({week:state.week,title,text,type});state.diary=state.diary.slice(0,120)}
function notify(text){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.appendChild(t);toastTimer=setTimeout(()=>t.remove(),2600)}
function start(name){let seed;try{const a=new Uint32Array(1);crypto.getRandomValues(a);seed=a[0]}catch{seed=Date.now()>>>0}state={version:2,seed,name:name.trim().slice(0,16)||'小光',week:1,slots:3,energy:75,money:300,skill:20,trust:25,heart:75,fans:18,origin:null,trait:null,project:null,published:[],diary:[],flags:{},seen:{},pending:null,followups:[],weather:null,trend:null,gear:0,restCount:0,dialogue:0,cooperations:0,ended:false};state.origin=pick(origins);state.trait=pick(traits);Object.assign(state,{energy:state.origin.energy,money:state.origin.money,skill:state.origin.skill});newWeek();log('我的第一个创作星期',`${state.origin.text}今天的你，是${state.trait.name}。`);tab='week';save();render()}
function newWeek(){state.slots=3;state.weather=pick([{name:'晴天',text:'窗边的光很好，今天适合慢慢做一点事。',emoji:'☀️'},{name:'小雨',text:'雨落在窗上，故事也可以慢慢讲。',emoji:'🌧️'},{name:'微风',text:'普通的一周，也可能遇到一点小惊喜。',emoji:'🍃'}]);state.trend=pick(films).id;state.market=roll(80,135)/100}
function spend(cost=0){if(state.slots<=0){notify('这周的空闲时段已经用完，翻到下一周吧。');return false}if(state.money<cost){notify('余额不够，先接一点工作或选择免费的安排吧。');return false}state.slots--;state.money-=cost;return true}
function action(id){if(state.pending||state.ended)return;const actions={rest:()=>{if(!spend())return;change({energy:roll(17,25),heart:roll(5,11)});state.restCount++;log('让身体先慢下来',pick(['散步时想起一个镜头。你记在手机里，然后好好看了一会儿树。','今晚吃了一顿热饭。没有打开剪辑软件，也没有因此失去成为创作者的资格。','你把手机放远了一点，睡了一个不用听导出进度的觉。']))},life:()=>{if(!spend(12))return;change({energy:12,heart:18});state.restCount++;log('有人陪你过一个普通晚上','你说起最近想分析的人物。对方认真听，还问了一个让你突然想通的问题。喜欢的事被听见，是很轻的幸福。');if(state.project)state.project.quality+=3},learn:()=>{if(!spend())return;change({skill:state.origin.bonus==='learn'?9:6,energy:-9,heart:2});log('学会一个小技巧','你练了声音处理和叙事节奏。下一支视频的开头，终于不用靠花哨转场撑起来了。')},work:()=>{if(!spend())return;const pay=state.origin.bonus==='work'?75:60;change({money:pay,energy:-13,heart:-3});log('给生活补一点余地',`接了一个小任务，赚到 ${pay} 元。梦想需要热情，有时也需要一份踏实的生活预算。`)},reply:()=>{if(!spend())return;const bonus=state.trait.bonus==='reply'?4:0;change({trust:7+bonus,heart:5,energy:-6,fans:roll(3,12)});state.dialogue++;log('评论区的小小对话',state.published.length?'你认真回复一条人物分析的评论。对方说：“原来你也会这样想。”一段讨论慢慢变成下一期的灵感。':'你在喜欢的作品下面写了一条认真讨论人物的长评。创作的连接，也可以从还没有自己的视频时开始。')},gear:()=>{if(state.gear>=2){notify('目前的设备够用了，先把故事讲好吧。');return}const cost=state.gear?120:90;if(!spend(cost))return;state.gear++;change({energy:-3,heart:5});log('添置一点顺手的工具',state.gear===1?'一支基础麦克风让人声更清楚。你还为项目建了素材备份。':'你升级了存储和整理工具，剪辑不再总是被卡顿打断。')} };if(actions[id]){actions[id]();clamp();save();render()}}
function chooseTopic(){if(!spend())return;state.project={film:draftFilm||state.trend,angle:draftAngle,stage:0,research:0,quality:24+state.skill*.3,started:state.week,polish:0};change({energy:-4,heart:4});log('新选题夹，建立了',`《${film(state.project.film).name}》· ${angle(draftAngle).name}。${film(state.project.film).question}`,'create');tab='week';draftFilm=null;save();render()}
function createTask(id){const p=state.project;if(!p)return;if(id==='research'){if(!spend())return;p.research++;p.quality+=roll(7,12)+(state.trait.bonus==='research'?4:0);change({skill:3,energy:-8});log('重看那些没被说出的细节',`你为《${film(p.film).name}》记下新线索。素材研究 ${p.research} 次，分析终于有了更稳的依据。`,'create')}
else if(id==='polish'){if(p.polish>=2){notify('这一支已经精修两次。给它一个见到观众的机会吧。');return}if(!spend())return;p.polish++;p.quality+=roll(8,12)+(state.trait.bonus==='polish'?4:0);change({skill:2,energy:-14});log('把那一段重新剪好','调整了呼吸、字幕和镜头之间的停顿。表达更顺了，夜也更深了一点。','create')}
else if(id==='advance'){if(!spend())return;const fatigue=state.energy<25?-9:state.energy<40?-4:0;p.quality+=roll(5,10)+state.gear*3+fatigue;change({skill:3,energy:-(state.gear?8:11),heart:2});const labels=['写出分析稿','录下自己的声音','剪成一支完整的视频'];log(labels[p.stage],pick(['有一句话删掉又写回。你想让它清楚，也想让它真的属于自己。','你把人物的选择放回当时的处境，故事慢慢有了温度。','做到一半卡住了，换一个开头后，突然顺了起来。']),'create');p.stage++}
else if(id==='publish'){publish();return}clamp();save();render()}
function publish(){const p=state.project;if(!p||p.stage<3)return;state.pending={type:'publish'};save();render()}
function release(style){const p=state.project;if(!p)return;const a=angle(p.angle);let q=p.quality+a.quality+(p.research>=2?8:p.research===0?-8:0);if(p.angle==='debate'&&p.research===0)q-=8;q=Math.max(10,Math.min(100,Math.round(q)));const hot=p.film===state.trend?1.4:1;const chance=rng();let luck=chance<.11?3.8:chance<.3?.48:.75+rng()*.8;let reach=(220+q*10+state.fans*1.8)*luck*hot*state.market;if(style==='hook')reach*=1.45;if(style==='calm')reach*=.84;if(state.flags.collabReach){reach*=1.6;delete state.flags.collabReach}const views=Math.round(reach),newFans=Math.round(views*(.012+q*.00032)*(style==='hook'?.78:1));let trust=a.trust+(q>=70?4:0)+(style==='calm'?3:style==='hook'?-7:0);if(style==='hook')state.flags.hook=(state.flags.hook||0)+1;change({fans:newFans,trust,heart:chance<.3?-5:8,skill:3});const v={film:p.film,angle:p.angle,quality:q,views,fans:newFans,week:state.week,title:film(p.film).question,comment:pick(q>=65?['“这个人物被你讲得好温柔。”','“看完忍不住重新看了一遍这场戏。”','“我也经历过类似的关系，谢谢你认真讲它。”']:['“想听你继续展开这个观点。”','“声音很真诚，节奏还可以再紧一点。”','“有一个细节想和你讨论。”'])};state.published.unshift(v);state.project=null;state.flags.best=Math.max(state.flags.best||0,q);log(`《${film(v.film).name}》已发布`,`${views.toLocaleString()} 次播放，${newFans} 位新朋友。${chance<.11?'这一次，推荐流送来了一阵意外的风。':chance<.3?'这次被看见的人不多，认真做过的部分却仍会留在你身上。':'作品开始慢慢走向自己的观众。'}`,'publish');state.pending={type:'result',video:v,quiet:chance<.3};save();render()}

function weightedEvent(){let pool=events.filter(e=>(!e.condition||e.condition(state))&&state.week-(state.seen[e.id]||-10)>2);if(!pool.length)pool=events.filter(e=>!e.condition||e.condition(state));const weights=pool.map(e=>e.weight/(1+(state.flags['seen-'+e.id]||0)));let n=rng()*weights.reduce((a,b)=>a+b,0);let chosen=pool[pool.length-1];for(let i=0;i<pool.length;i++){n-=weights[i];if(n<=0){chosen=pool[i];break}}state.seen[chosen.id]=state.week;state.flags['seen-'+chosen.id]=(state.flags['seen-'+chosen.id]||0)+1;return chosen}
function nextWeek(){if(state.pending||state.ended)return;const unused=state.slots;if(unused){change({energy:unused*7,heart:unused*2});state.restCount++;log('给空白留一点位置',`这周剩下的 ${unused} 个时段留给了休息。空着的时间也可以有意义。`)}const cost=28;const paid=Math.min(state.money,cost);change({money:-paid,energy:3,heart:paid<cost?-6:0});log('这一周的生活账本',`基础开支 ${paid} 元。${paid<cost?'预算有点紧，下一周可以安排一点工作。':'日常过好了，创作才有地方落脚。'}`);state.slots=0;const e=weightedEvent();state.pending={type:'event',id:e.id};save();render()}
function resolveEvent(i){const e=events.find(e=>e.id===state.pending.id),c=e.choices[i];if(c.cost&&state.money<c.cost){notify('余额不够，试试另一个选择吧。');return}change(c.effects);if(c.quality&&state.project)state.project.quality+=c.quality;if(c.advance&&state.project)state.project.stage=Math.min(3,state.project.stage+1);if(c.flag)state.flags[c.flag]=(state.flags[c.flag]||0)+1;if(c.randomFans)change({fans:roll(25,70)});if(c.schedule)state.followups.push({kind:c.schedule,due:state.week+(c.schedule==='collab'?1:2)});log(e.title,`${c.text}。${c.hint}`,'event');state.pending=null;if(state.week>=WEEKS){state.ended=true;save();render();return}state.week++;newWeek();if(c.loseSlot)state.slots=Math.max(0,state.slots-c.loseSlot);handleFollowup();save();render()}
function handleFollowup(){const due=state.followups.filter(f=>f.due<=state.week);state.followups=state.followups.filter(f=>f.due>state.week);for(const f of due){if(f.kind==='viewer'){change({trust:7,heart:8});state.flags.community=(state.flags.community||0)+1;log('她带着自己的故事回来了','还记得你邀请观众分享选题吗？她认真写了一个关于女性成长的问题，你们的对话有了下文。','event')}
if(f.kind==='collab'){state.slots=Math.max(0,state.slots-1);change({skill:5,trust:6,energy:-8});state.flags.collabReach=true;log('赴约，一起聊一聊人物','为之前答应的合作留了 1 个时段。对方带来一个不同的角度，下一支发布的视频会得到合作分享。','event')}
if(f.kind==='ad'){state.slots=Math.max(0,state.slots-1);change({money:110,trust:3,energy:-6});state.cooperations++;log('认真履行第一次约定','用 1 个时段完成试用和独立广告段，并明确标注。收到 110 元报酬，也保留了自己分析的自由。','event')}}}
function stats(){return `<div class="stats">${[['energy','精力',state.energy,''],['heart','心情',state.heart,''],['money','生活余额',state.money,'元'],['skill','表达',state.skill,''],['trust','信任',state.trust,'']].map(([k,t,v,u])=>`<div class="stat"><span>${t}</span><strong>${v}<small class="small">${u}</small></strong>${k!=='money'?`<div class="bar"><i style="width:${v}%"></i></div>`:''}</div>`).join('')}</div>`}

function projectHTML(){const p=state.project;if(!p)return `<div class="project"><div class="eyebrow">书桌上的空白，等你的第一个故事</div><h3>这次，你想聊谁？</h3><p class="note">选一部喜欢的作品，再找到属于你的分析角度。完成一支视频通常需要几周，研究和精修由你决定。</p><button class="secondary" id="open-films" ${state.slots===0?'disabled':''}>翻开选题本 · 1 时段</button></div>`;const f=film(p.film);return `<div class="project"><div class="row"><span class="badge">正在创作</span><span class="note">研究 ${p.research} 次 · 精修 ${p.polish} 次</span></div><h3>${f.color}《${f.name}》</h3><p class="note">${angle(p.angle).name} · ${f.question}</p><div class="stages">${['写稿','录音','剪辑','发布'].map((t,i)=>`<span class="stage ${i<p.stage?'done':i===p.stage?'current':''}">${t}</span>`).join('')}</div><div class="row"><button class="primary" data-task="${p.stage>=3?'publish':'advance'}" ${p.stage<3&&state.slots===0?'disabled':''}>${['写好分析稿','录下自己的声音','剪成完整的视频','选择发布方式'][p.stage]}${p.stage<3?' · 1 时段':''}</button><button class="quiet" data-task="research" ${state.slots===0?'disabled':''}>重看与研究 · 1 时段</button>${p.stage>=2?`<button class="quiet" data-task="polish" ${state.slots===0||p.polish>=2?'disabled':''}>精修一次 · 1 时段</button>`:''}</div><p class="note">${p.research===0?'还没研究素材，观点可能会缺一点依据。':p.research>=2?'资料已经比较扎实，也记得让它保留你的声音。':'已找到一些细节，可以再研究，也可以往前做。'}${state.energy<30?' 你有些累了，低精力会影响创作质量。':''}</p></div>`}
function weekView(){const due=state.followups.map(f=>`第 ${f.due} 周 · ${f.kind==='collab'?'合作准备，占用 1 时段':f.kind==='ad'?'试用合作，占用 1 时段':'观众来信'}`);return `<div class="grid"><section class="paper"><div class="section-head"><h3>这一周，怎么过？</h3><div class="row"><div class="slots" aria-hidden="true">${Array.from({length:3},(_,i)=>`<i class="${i>=state.slots?'used':''}"></i>`).join('')}</div><span class="note">剩 ${state.slots} 时段</span></div></div><p class="note">每周有 3 个自由时段。创作、工作和生活，都想分到一点时间。</p>${projectHTML()}<div class="choice-grid">${[['rest','🌿 好好休息','恢复精力和心情 · 免费'],['life','☕ 和喜欢的人坐一会儿','找回生活的温度 · 12 元'],['learn','📒 练一个剪辑技巧','提升表达，消耗少量精力'],['work','🧺 接一点工作','赚取生活费，消耗精力'],['reply','💬 认真交流','提高信任，认识一些新朋友'],['gear','🎙️ 添置顺手的工具',state.gear>=2?'设备已经够用了':`减少创作消耗 · ${state.gear?120:90} 元`]].map(([id,t,h])=>`<button class="choice" data-action="${id}" ${state.slots===0||id==='gear'&&state.gear>=2?'disabled':''}><strong>${t}</strong><small>${h} · 1 时段</small></button>`).join('')}</div><div class="actions"><button class="secondary" id="next-week">${state.slots?'留点空白，结束这一周':'收好这一周，看看会发生什么'}</button></div><p class="note">剩余时段会用于休息；每周基础开支 28 元。结束这周后，会遇到一个可以回应的小故事。</p></section><aside><section class="paper"><div class="eyebrow">本周选题风向</div><h3>${film(state.trend).color} ${film(state.trend).name}</h3><p class="note">最近更多人在讨论它。跟上话题可能更容易被看见，做自己喜欢的选题也有机会。</p>${due.length?`<hr class="cut"><h3>记得赴约</h3>${due.map(t=>`<p class="note">${t}</p>`).join('')}`:''}<details><summary>这一局的起点与性格</summary><p>${state.origin.name} · ${state.trait.name}</p><p>${state.trait.text}</p><p>每支视频的质量、传播、反馈都有变化；热度只是机会，作品的深度影响留下来的人。</p></details></section><section class="paper" style="margin-top:18px"><div class="eyebrow">手记里的最近几页</div>${state.diary.slice(0,3).map(h=>`<div class="log-item"><span class="note">第 ${h.week} 周</span><h3>${esc(h.title)}</h3><p class="note">${esc(h.text)}</p></div>`).join('')}</section></aside></div>`}
function filmsView(){const selected=draftFilm||state.trend;return `<section class="paper"><div class="eyebrow">选题本 / 喜欢可以有很多种表达</div><h2>从哪一个故事开始？</h2><p class="note">${state.project?'书桌上还有一支视频。可以翻看选题，等它发布后再开始下一支。':'建立选题用 1 个时段。作品和分析角度的组合，会影响反馈与观众信任。'}</p><div class="film-grid">${films.map(f=>`<button class="film ${selected===f.id?'selected':''}" data-film="${f.id}" aria-pressed="${selected===f.id}"><div>${f.color} <span class="badge">${f.theme}</span></div><h3>${f.name}</h3><p class="note">${f.question}</p>${f.id===state.trend?'<span class="badge">本周讨论更多</span>':''}</button>`).join('')}</div><h3>这一次，想怎样讲？</h3><div class="choice-grid">${angles.map(a=>`<button class="choice ${draftAngle===a.id?'selected':''}" data-angle="${a.id}" aria-pressed="${draftAngle===a.id}"><strong>${a.name}</strong><small>${a.hint}</small></button>`).join('')}</div><div class="actions"><button class="primary" id="choose-topic" ${state.project||state.slots===0?'disabled':''}>把这个选题放上书桌 · 1 时段</button></div></section>`}
function worksView(){return `<section class="paper"><div class="eyebrow">你的作品 / 每一支，都真的做过</div><h2>我的小小放映室</h2>${state.published.length?state.published.map(v=>`<article class="result-card"><span class="note">第 ${v.week} 周 · ${angle(v.angle).name}</span><h3>${film(v.film).color}《${film(v.film).name}》</h3><p>${v.title}</p><div class="meta"><span>${v.views.toLocaleString()} 播放 · ${v.fans} 位新朋友</span><span>完成度 ${v.quality}</span></div><p class="note">${v.comment}</p></article>`).join(''):'<div class="message"><p>还没有发布作品，没关系。</p><p class="note">回到书桌，先让第一个想法成为一个选题，再一点点完成它。</p></div>'}</section>`}
function diaryView(){return `<section class="paper"><div class="section-head"><div><div class="eyebrow">那些普通，却没有白过的日子</div><h2>这一季的成长手记</h2></div><button class="quiet" id="download">保存手记</button></div>${state.diary.map(h=>`<article class="log-item"><span class="badge">第 ${h.week} 周</span><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p></article>`).join('')}<hr class="cut"><button class="quiet danger" id="reset">重新开始这一季</button></section>`}
function eventView(){const p=state.pending;if(p.type==='publish')return `<section class="paper event"><div class="eyebrow">导出完成 / 把声音交给世界</div><h2>这一支，怎么发布？</h2><p>《${film(state.project.film).name}》已经剪完了。开场和标题，会决定人们如何遇到你的分析。</p><div class="choices"><button class="choice" data-release="honest"><strong>用清楚的问题邀请大家进来</strong><small>传播与信任比较均衡，让标题和内容彼此照应。</small></button><button class="choice" data-release="calm"><strong>保留温柔的节奏，留给愿意听的人</strong><small>初始传播稍慢，更容易建立信任。</small></button><button class="choice" data-release="hook"><strong>试一个更有争议的标题</strong><small>可能获得更多曝光，但信任和关注转化会受影响。</small></button></div><button class="quiet" id="cancel-publish">先回书桌想一想</button></section>`;
if(p.type==='result'){const v=p.video;return `<section class="paper event"><div class="eyebrow">第 ${state.week} 周 / 第一声回音</div><h2>你又完成了一个故事。</h2><p>《${film(v.film).name}》已经出现在你的主页上。</p><div class="result-card"><div class="row"><span class="badge">${v.views.toLocaleString()} 次播放</span><span class="badge">${v.fans} 位新朋友</span><span class="badge">完成度 ${v.quality}</span></div><p>${v.comment}</p></div><p>${p.quiet?'这次的推荐很安静。数据不是对你这个人的评分；你可以从一处具体的反馈里，带走下一次的改进。':'你不知道它会走到谁的屏幕上。但现在，世界里确实多了一份属于你的理解。'}</p><button class="primary" id="close-result">收下回声，回到生活</button></section>`}
const e=events.find(e=>e.id===p.id);return `<section class="paper event"><div class="eyebrow">第 ${state.week} 周的插曲 / 生活没有固定剧本</div><h2>${e.title}</h2><p>${e.text}</p><div class="choices">${e.choices.map((c,i)=>`<button class="choice" data-event="${i}" ${c.cost&&state.money<c.cost?'disabled':''}><strong>${c.text}</strong><small>${c.hint}${c.cost&&state.money<c.cost?' · 余额暂时不够':''}</small></button>`).join('')}</div><p class="note">有些约定会在之后回来，有些影响会留在作品里。</p></section>`}
function endingId(){if(state.energy<25||state.heart<25)return 'rest';if(state.published.length>=4&&state.cooperations>=1&&state.money>=180&&state.skill>=65)return 'career';if(state.dialogue>=5&&state.trust>=75&&state.published.length>=2)return 'community';if(state.published.filter(v=>v.quality>=75).length>=3&&state.trust>=65)return 'author';if(state.published.length>=3&&state.restCount>=4&&state.energy>=40)return 'sustain';return 'start'}
function endingView(){const id=endingId(),e=endingList.find(x=>x[0]===id);let collected=[];try{collected=JSON.parse(localStorage.getItem('up-dream-life-endings')||'[]');if(!collected.includes(id))collected.push(id);localStorage.setItem('up-dream-life-endings',JSON.stringify(collected))}catch{collected=[id]}return `<section class="paper ending"><div class="eyebrow">第十六周 / 这一季的结尾</div><h2>${e[1]}</h2><p>${e[2]}</p><div class="result-card"><p>这一季，你发布了 <strong>${state.published.length}</strong> 支作品，认识了 <strong>${state.fans}</strong> 位朋友。</p><p class="note">${state.project?'书桌上还留着一支没做完的视频。未完成的想法，也可以留给下一季。':'每支完成的作品，都是一段认真走过的路。'}</p></div><div class="letter"><h3>写给正在努力的你</h3><p>愿你喜欢的故事，能被你用自己的声音讲出来。愿你有被听见的幸运，也有慢慢积累的耐心。</p><p>你不需要先成为很厉害的人，才配开始。那个在剪辑软件前反复尝试的你，已经在走自己的路。</p><p class="sign">有人一直期待，听你讲下一个故事。</p></div><div class="actions"><button class="primary" id="again">再过一种创作生活</button><button class="quiet" id="download">保存这一季的手记</button><button class="quiet" id="view-diary">看看走过的日子</button></div><h3 style="margin-top:28px">故事收藏 · ${collected.length} / 6</h3><div class="outcomes">${endingList.map(x=>`<div class="result-card ${collected.includes(x[0])?'unlocked':'locked'}">${collected.includes(x[0])?x[1]:'还没走到的另一种生活'}</div>`).join('')}</div><p class="note">不同起点、选择和际遇，会写出不同的一季。所有播放和关注都是虚构模拟数值。</p></section>`}
function render(){let content=state.pending?eventView():state.ended&&tab!=='diary'?endingView():tab==='films'?filmsView():tab==='works'?worksView():tab==='diary'?diaryView():weekView();chrome(content);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>createTask(b.dataset.task));document.querySelectorAll('[data-film]').forEach(b=>b.onclick=()=>{draftFilm=b.dataset.film;render()});document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{draftAngle=b.dataset.angle;render()});document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>release(b.dataset.release));document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>resolveEvent(Number(b.dataset.event)));if($('#open-films'))$('#open-films').onclick=()=>{tab='films';render()};if($('#choose-topic'))$('#choose-topic').onclick=chooseTopic;if($('#next-week'))$('#next-week').onclick=nextWeek;if($('#cancel-publish'))$('#cancel-publish').onclick=()=>{state.pending=null;save();render()};if($('#close-result'))$('#close-result').onclick=()=>{state.pending=null;save();render()};if($('#download'))$('#download').onclick=download;if($('#again'))$('#again').onclick=()=>intro(true);if($('#reset'))$('#reset').onclick=()=>intro(true);if($('#view-diary'))$('#view-diary').onclick=()=>{tab='diary';render()};if(state.ended&&tab==='diary'){const back=document.createElement('button');back.className='secondary';back.textContent='回到这一季的结尾';back.onclick=()=>{tab='week';render()};$('#app').appendChild(back)}}
function download(){const e=state.ended?endingList.find(x=>x[0]===endingId())[1]:'还在写的这一季';const txt=`把喜欢剪成光\n${state.name} · ${e}\n${state.published.length} 支作品 · ${state.fans} 位朋友\n\n`+state.diary.slice().reverse().map(h=>`第 ${h.week} 周 · ${h.title}\n${h.text}`).join('\n\n');const u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='我的创作生活手记.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function intro(reset=false){lastView=null;const old=saved();$('#app').innerHTML=`<section class="intro"><div><div class="eyebrow">创作生活模拟 / 每次开始，都是新的际遇</div><h1>在普通日子里，<br>慢慢剪出自己的光。</h1><p class="muted">从第一张选题纸，到有人等你更新。<br>把喜欢的影视故事，讲成自己的声音。</p><label for="name">手账扉页，写上你的名字</label><input id="name" maxlength="16" placeholder="小光" autocomplete="off"><div class="actions"><button class="primary" id="start">打开我的新一季</button>${old?`<button class="quiet" id="continue">${reset?'先回到当前手账':'继续上次的手账'}</button>`:''}</div><p class="note">16 周 · 每周 3 个自由时段 · 约 20–30 分钟<br>随机起点、创作反馈与生活插曲，写出不同的故事。</p><details><summary>怎么玩这一季？</summary><p>先在选题本里选一部作品和分析角度，用几个时段完成写稿、录音和剪辑。研究和精修能提高作品质量，但也会花掉时间和精力。</p><p>每周留一点时间工作、交流或休息。结束一周后会遇到随机事件，有些选择会在之后产生影响。所有进度自动保存在这个浏览器里。</p></details></div><aside class="letter"><div class="eyebrow">给正在努力成为 UP 主的你</div><h2>喜欢的事，<br>值得认真开始。</h2><p>也许你只是想把一个人物讲清楚，想让别人也看见那个让你停下来的镜头。</p><p>这已经是很好的起点了。</p><p>你可以慢慢学、慢慢剪，也可以在累的时候休息。这里有人，愿意陪你把普通的日子过成自己的故事。</p><p class="sign">🌷 梦想慢慢来，你也慢慢来。</p></aside></section>`;$('#start').onclick=()=>start($('#name').value);$('#name').onkeydown=e=>{if(e.key==='Enter')start($('#name').value)};if($('#continue'))$('#continue').onclick=()=>{state=old;tab='week';render()}}
let audioCtx=null;$('#sound').onclick=()=>{if(audioCtx){audioCtx.close();audioCtx=null;$('#sound').textContent='♫ 氛围音 · 关';$('#sound').setAttribute('aria-pressed','false');return}try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();const gain=audioCtx.createGain();gain.gain.value=.012;gain.connect(audioCtx.destination);[130.81,196,261.63,329.63].forEach((f,i)=>{const o=audioCtx.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=i*1.4;o.connect(gain);o.start()});$('#sound').textContent='♫ 氛围音 · 开';$('#sound').setAttribute('aria-pressed','true')}catch{notify('这个浏览器暂时不支持氛围音')}};
intro();
</script></body></html>
